# Quality gate (Part 7 — Exercise 7.3): chạy eval trên golden dataset cho mỗi pull request.
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có regression so với --baseline
# → bước này fail → check của PR đỏ → (khi bật branch protection "Require status checks") không merge được.
name: quality-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        env:
          AGENT_VERSION: v2
          PORT: "8000"
          MOCK_ERROR_RATE: "0"   # tắt lỗi ngẫu nhiên để kết quả eval ổn định (không flaky)
        run: |
          python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && exit 0; sleep 1; done
          cat agent.log; exit 1

      - name: Eval + quality gate (accuracy ≥ 85%, không regression so với v2 đã duyệt)
        run: |
          python eval/run_eval.py --url http://localhost:8000 \
            --min-accuracy 0.85 --baseline reports/eval_v2_fixed.json
