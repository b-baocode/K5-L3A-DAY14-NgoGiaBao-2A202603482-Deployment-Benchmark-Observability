# Render Blueprint — web service (Docker) + Redis (Key Value).
# Secret AGENT_API_KEY dùng `sync: false` → Render hỏi giá trị khi tạo Blueprint, không nằm trong Git.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    maxmemoryPolicy: noeviction   # không tự xoá key rate limit / cost khi đầy bộ nhớ
    ipAllowList: []               # chỉ service nội bộ của Render truy cập được
