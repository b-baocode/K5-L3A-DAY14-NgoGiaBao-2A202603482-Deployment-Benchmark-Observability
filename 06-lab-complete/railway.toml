# Railway — deploy bằng Dockerfile.
# Secrets (AGENT_API_KEY) và REDIS_URL đặt trong Railway dashboard → Variables, KHÔNG ghi ở đây.
# Railway cấp biến PORT; CMD trong Dockerfile đã lắng nghe theo ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
