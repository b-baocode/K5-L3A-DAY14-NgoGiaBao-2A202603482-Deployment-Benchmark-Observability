# ============================================================
# Agent + Redis bằng một lệnh:
#   cp .env.example .env   # rồi đặt AGENT_API_KEY
#   docker compose -p k5-day14-final up -d --build
#   curl http://localhost:8000/ready
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env            # secrets (AGENT_API_KEY...) — file nằm trong .gitignore
        required: false       # không có .env vẫn chạy được (mọi /ask sẽ trả 401)
    environment:
      PORT: "8000"
      REDIS_URL: redis://redis:6379/0   # tên service "redis" = hostname trong network của compose
    depends_on:
      redis:
        condition: service_healthy      # chờ Redis trả PONG rồi mới khởi động agent
    restart: unless-stopped
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # ghi AOF → restart Redis không mất state
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
